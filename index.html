    body {

    .font-mono-numbers { font-family: 'JetBrains Mono', monospace; }

    /* --- Light Mode (Para sa Snow, Sky, Rose, Cream) --- */
    .light-mode { color: #0f172a; }
    .light-mode .glass-card { 
        background: rgba(255, 255, 255, var(--glass-opacity, 0.8)); 
        border: 1px solid rgba(0, 0, 0, 0.05); 
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }
    .light-mode .modal-content { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; }
    
    /* Auto-fix para sa text na hardcoded na white sa HTML */
    .light-mode .text-white, 
    .light-mode .font-white,
    .light-mode p.text-white { color: #0f172a !important; }
    
    /* Keypad sa Light Mode */
    .light-mode .num-btn { background: rgba(0,0,0,0.06); color: #0f172a; border: 1px solid rgba(0,0,0,0.03); }

    /* --- Dark Mode (Para sa Night, Forest, Ruby, Earth) --- */
    .dark-mode { color: #ffffff; }
    .dark-mode .glass-card { 
        background: rgba(0, 0, 0, var(--glass-opacity, 0.5)) !important; 
        border: 1px solid rgba(255, 255, 255, 0.1); 
    }
    .dark-mode .modal-content { background: #0f172a; color: #ffffff; border: 1px solid #1e293b; }
    .dark-mode .text-emerald-600 { color: #34d399 !important; text-shadow: 0 0 10px rgba(52, 211, 153, 0.3); }
    .dark-mode input { color: white; }
    
    /* Keypad sa Dark Mode */
    .dark-mode .num-btn { background: rgba(255,255,255,0.1); color: #ffffff; border: 1px solid rgba(255,255,255,0.05); }

    /* --- Keypad & Modals --- */
    .num-btn { 
        height: 55px; display: flex; align-items: center; justify-content: center; 
        font-size: 1.25rem; font-weight: 800; border-radius: 1rem; 
        transition: all 0.1s; cursor: pointer; user-select: none; 
        -webkit-tap-highlight-color: transparent; touch-action: manipulation; 
    }
    .num-btn:active, .num-btn.active-key { background: #10b981 !important; color: white !important; transform: scale(0.95); }
    
    .modal { 
        position: fixed; inset: 0; background: rgba(0,0,0,0.85); 
        backdrop-filter: blur(10px); display: flex; align-items: center; 
        justify-content: center; z-index: 9999; padding: 1.5rem; 
    }
    .hidden { display: none !important; }
    .theme-preview { height: 35px; width: 100%; border-radius: 8px; border: 2px solid rgba(255,255,255,0.1); }
    
    /* =========================================================
   POWERCON MOBILE READING OPTIMIZATION
   UI ONLY — NO READING LOGIC CHANGES
   ========================================================= */

.powercon-equipment-card {
    width: 100%;
    text-align: center;
    padding: 0.9rem 0.75rem;
    border-radius: 1.25rem;
    margin-bottom: 1rem;

    overflow: visible;

    overflow-wrap: anywhere;
    word-break: normal;
}

.powercon-equipment-name {
    font-size: clamp(1rem, 4.8vw, 1.35rem);
    line-height: 1.2;
    font-weight: 800;
    text-align: center;

    overflow-wrap: anywhere;
}

.powercon-reading-label {
    font-size: clamp(0.62rem, 2.4vw, 0.75rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.powercon-reading-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.15rem, 5.8vw, 1.7rem);
    line-height: 1.15;
    font-weight: 800;

    white-space: nowrap;
    overflow: visible;
}

.powercon-current-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(2.25rem, 12vw, 3.8rem);
    line-height: 1;
    font-weight: 800;

    width: 100%;
    min-width: 0;

    text-align: center;

    white-space: nowrap;
    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;
}

.powercon-current-input::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   RECORDS / LOGSHEET
   ========================================================= */

.powercon-record-card {
    width: 100%;
    min-width: 0;

    /*
      IMPORTANT:
      Huwag putulin ang mahahabang readings.
    */
    overflow: visible;
}

/* =========================================================
   LOGSHEET EQUIPMENT LABEL
   Green badge + LOCATION always below
   ========================================================= */

.powercon-record-equipment {
    display: block;

    width: fit-content;
    max-width: 100%;

    margin: 0 auto;

    padding: 0.45rem 0.85rem;

    border-radius: 0.7rem;

    background: linear-gradient(
        135deg,
        #047857 0%,
        #10b981 50%,
        #059669 100%
    );

    border: 1px solid rgba(255, 255, 255, 0.25);

    color: #ffffff !important;

    font-size: clamp(0.72rem, 3.2vw, 0.9rem);
    line-height: 1.25;

    font-weight: 900;

    text-align: center;
    text-transform: uppercase;

    letter-spacing: 0.02em;

    text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.35);

    box-shadow:
        0 4px 14px rgba(16, 185, 129, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

    overflow-wrap: anywhere;
    word-break: normal;
}


/* =========================================================
   LOCATION
   UTILITIES / PROCESS / BOTTLING
   Always below equipment badge
   ========================================================= */

.powercon-record-equipment + span {
    display: block !important;

    width: 100%;

    margin-top: 1px !important;

    text-align: center;

    line-height: 1.1;

    white-space: nowrap;
}


/* =========================================================
   READING GRID
   ========================================================= */

.powercon-record-grid {
    display: grid;

    /*
      CURRENT gets slightly more room.
      Mas safe ito sa mahahabang decimal values.
    */
    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1.25fr)
        minmax(0, 0.95fr);

    width: 100%;

    gap: clamp(0.25rem, 1.8vw, 0.7rem);

    align-items: center;

    overflow: visible;
}


/* =========================================================
   READING CELL
   ========================================================= */

.powercon-record-cell {
    min-width: 0;

    text-align: center;

    padding:
        clamp(0.5rem, 2.5vw, 0.8rem)
        0.15rem;

    border-radius: 0.9rem;

    /*
      IMPORTANT:
      Ito ang dating nagpuputol ng long numbers.
    */
    overflow: visible;
}


/* =========================================================
   LABEL
   ========================================================= */

.powercon-record-label {
    display: block;

    width: 100%;

    font-size: clamp(0.55rem, 2.2vw, 0.7rem);

    line-height: 1.1;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 0.03em;

    white-space: nowrap;

    overflow: visible;
}


/* =========================================================
   READING VALUE
   ========================================================= */

.powercon-record-value {
    display: block;

    width: 100%;

    margin-top: 0.35rem;

    font-family: 'JetBrains Mono', monospace;

    /*
      Responsive size.
      Mahabang number = mas compact sa small screen.
    */
    font-size: clamp(
        0.68rem,
        4vw,
        1.15rem
    );

    line-height: 1.1;

    font-weight: 800;

    white-space: nowrap;

    overflow: visible;

    text-overflow: clip;

    letter-spacing: -0.055em;

    text-align: center;
}


/* =========================================================
   CURRENT READING HIGHLIGHT
   ========================================================= */

.powercon-record-current {
    background: rgba(16, 185, 129, 0.10);

    border: 1px solid rgba(16, 185, 129, 0.25);

    color: #10b981;

    box-shadow:
        0 3px 12px rgba(16, 185, 129, 0.08);
}


/* =========================================================
   TOTAL = 0
   ========================================================= */

.powercon-record-total-zero {
    font-family: 'JetBrains Mono', monospace;

    font-weight: 900;

    /*
      Kapag zero:
      0
      instead of:
      0.000
    */
}


/* =========================================================
   VERY SMALL ANDROID
   ========================================================= */

@media (max-width: 350px) {

    .powercon-record-grid {
        grid-template-columns:
            minmax(0, 1fr)
            minmax(0, 1.25fr)
            minmax(0, 0.95fr);

        gap: 0.15rem;
    }

    .powercon-record-cell {
        padding-left: 0.05rem;
        padding-right: 0.05rem;
    }

    .powercon-record-value {
        font-size: 0.62rem;
        letter-spacing: -0.07em;
    }

    .powercon-record-label {
        font-size: 0.48rem;
    }
}


/* =========================================================
   NORMAL PHONES
   ========================================================= */

@media (min-width: 351px) and (max-width: 430px) {

    .powercon-record-value {
        font-size: clamp(
            0.68rem,
            3.8vw,
            1rem
        );

        letter-spacing: -0.06em;
    }
}


/* =========================================================
   LARGE PHONES
   Samsung / iPhone Pro Max / etc.
   ========================================================= */

@media (min-width: 431px) {

    .powercon-record-grid {
        gap: 0.65rem;
    }

    .powercon-record-value {
        font-size: 1.15rem;

        letter-spacing: -0.04em;
    }
}


/* =========================================================
   TABLET / DESKTOP
   ========================================================= */

@media (min-width: 640px) {

    .powercon-reading-number {
        font-size: 1.8rem;
    }

    .powercon-current-input {
        font-size: 3.5rem;
    }

    .powercon-record-value {
        font-size: 1.2rem;

        letter-spacing: -0.035em;
    }
}
     /* =========================================================
   POWERCON EQUIPMENT LABEL
   Isolated from UI Theme Settings
   ========================================================= */

.powercon-equipment-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    max-width: 100%;

    padding: 0.65rem 1rem;
    border-radius: 0.9rem;

    background: linear-gradient(

        #047857 0%,
        #10b981 50%,
        #059669 100%
    );

    border: 1px solid rgba(255, 255, 255, 0.25);

    box-shadow:

        inset 0 1px 0 rgba(255, 255, 255, 0.20);

    color: #ffffff !important;

    font-size: clamp(0.95rem, 4.2vw, 1.25rem);
    line-height: 1.2;
    font-weight: 900;
    letter-spacing: 0.04em;

    text-align: center;
    text-transform: uppercase;

    text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.35);

    overflow-wrap: anywhere;
    word-break: normal;
}

/* =========================================================
   LOGSHEET COPY FOCUS
   Clicked equipment becomes clearly visible
   ========================================================= */

.powercon-record-card {
    position: relative;
    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.25s ease,
        opacity 0.25s ease,
        border-color 0.25s ease;
}

/* Normal cards become slightly quieter */
.powercon-record-card.powercon-unfocused {
    opacity: 0.55;
}

/* Selected card */
.powercon-record-card.powercon-focused {
    opacity: 1 !important;

    transform: scale(1.015);

    border: 2px solid #10b981 !important;

    box-shadow:
        0 0 0 3px rgba(16, 185, 129, 0.18),
        0 12px 35px rgba(16, 185, 129, 0.22);

    z-index: 5;
}

/* Small FOCUS indicator */
.powercon-focus-indicator {
    display: none;
}

.powercon-record-card.powercon-focused .powercon-focus-indicator {
    display: inline-flex;

    align-items: center;
    justify-content: center;

    position: absolute;
    top: 0.6rem;
    right: 0.6rem;

    width: 1.5rem;
    height: 1.5rem;

    border-radius: 999px;

    background: #10b981;
    color: white;

    font-size: 0.75rem;
    font-weight: 900;

    box-shadow:
        0 4px 12px rgba(16, 185, 129, 0.35);
}

/* Mobile: avoid excessive scaling */
@media (max-width: 480px) {
    .powercon-record-card.powercon-focused {
        transform: scale(1.01);
    }
}
     /* =========================================================
   POWERCON ACTION BUTTONS
   ========================================================= */

.powercon-action-btn {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 52px;
    padding: 0.85rem 0.75rem;

    font-size: clamp(0.68rem, 3vw, 0.82rem);
    line-height: 1.15;

    font-weight: 900;
    letter-spacing: 0.025em;

    text-align: center;
    white-space: nowrap;

    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);

    -webkit-font-smoothing: antialiased;

    transition:
        transform 0.15s ease,
        filter 0.15s ease;
}

.powercon-action-btn:active {
    transform: scale(0.96);
}
     .powercon-action-btn.powercon-download-btn {
    color: #ffffff !important;
    background: #0f172a !important;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.65);
}

@media (max-width: 350px) {
    .powercon-action-btn {
        min-height: 50px;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
        font-size: 0.62rem;
        letter-spacing: 0.015em;
    }
}

@media (min-width: 351px) and (max-width: 430px) {
    .powercon-action-btn {
        font-size: 0.7rem;
    }
}

@media (min-width: 431px) {
    .powercon-action-btn {
        font-size: 0.78rem;
    }
}
     /* =========================================================
   HOME — VIEW LOGSHEETS BUTTON
   Default = WHITE + BLACK TEXT
   Isolated from other UI components
   ========================================================= */

.powercon-view-logsheet-btn {
    background: #ffffff;
    color: #0f172a !important;

    border: 1px solid rgba(15, 23, 42, 0.08);

    box-shadow:
        0 4px 14px rgba(15, 23, 42, 0.10);

    text-shadow: none;

    -webkit-font-smoothing: antialiased;
}

.powercon-view-logsheet-btn:hover {
    background: #f8fafc;
}

.powercon-view-logsheet-btn:active {
    transform: scale(0.98);
}
     
/* =========================================================
   POWERCON HOME — CENTERED CONTROLS
   ========================================================= */

.powercon-home-controls {
    width: 100%;
    max-width: 360px;

    margin: auto;

    display: flex;
    flex-direction: column;

    justify-content: center;

}

/* Keep every control full width */
.powercon-home-controls > * {
    width: 100%;
}
</style>

const getLocalDate = (d) => { const offset = d.getTimezoneOffset(); const localDate = new Date(d.getTime() - (offset * 60 * 1000)); return localDate.toISOString().split('T')[0]; };

document.addEventListener('keydown', (e) => {
    if(app.state.view !== 'reading') return;
    const key = e.key;
    if(/[0-9]/.test(key)) { handleKey(key); animateKey(key); }
    else if(key === '.') { handleKey('.'); animateKey('.'); }
    else if(key === 'Backspace') { handleKey('⌫'); animateKey('⌫'); }
    else if(key === 'Enter') { window.enterNext(); }
});

function animateKey(k) {
    const btn = Array.from(document.querySelectorAll('.num-btn')).find(b => b.innerText === k);
    if(btn) { btn.classList.add('active-key'); setTimeout(() => btn.classList.remove('active-key'), 100); }
}

const formatUsageDisplay = (value) => {
    const num = parseFloat(value);

    if (!Number.isFinite(num) || num === 0) {
        return '0';
    }

    return String(value);
};

  async syncWithCloud(targetDate = null) {
    this.state.loading = true; this.render();
    const dateToQuery = targetDate || this.state.date;
    try {
      const snapshot = await db.ref('readings/' + dateToQuery).once('value');
      this.state.cloudReadings = snapshot.val() || {};
      const d = new Date(dateToQuery); d.setDate(d.getDate() - 1);
      const yKey = getLocalDate(d);
      const ySnap = await db.ref('readings/' + yKey).once('value');
      this.state.yesterdayReadings = ySnap.val() || {};
      MOCK_EQUIPMENT.forEach((eq, i) => { if(this.state.cloudReadings[eq.id]) this.state.sessionReadings[i] = this.state.cloudReadings[eq.id]; });
    } catch(e) { console.error(e); }

  async saveReading(currInput, prevInput) {
    const eq = MOCK_EQUIPMENT[this.state.currentIndex];
    
    // Panatilihin bilang string para hindi mawala ang decimal places
    const currentStr = currInput || "0";
    const prevStr = prevInput || "0";
    
    const currentNum = parseFloat(currentStr);
    const prevNum = parseFloat(prevStr);
    const usage = (currentNum - prevNum).toFixed(3);
    
    if (currentNum < prevNum && !confirm("⚠️ Current lower than previous. Save anyway?")) return;
    
    const data = { id: eq.id, name: eq.name, loc: eq.loc, curr: currentStr, prev: prevStr, usage: usage };
    this.state.sessionReadings[this.state.currentIndex] = data;
    localStorage.setItem('p_last_index', this.state.currentIndex + 1);
    if (this.state.isSingleEdit) {
        await db.ref(`readings/${this.state.filterDate}/${eq.id}`).set(data);
        this.state.isSingleEdit = false; this.state.view = 'records'; 
        await this.syncWithCloud(this.state.filterDate);
    } else if (this.state.isEditingFromReview) {
        this.state.isEditingFromReview = false; this.state.view = 'review'; this.render();
    } else {
        if (this.state.currentIndex < MOCK_EQUIPMENT.length - 1) { 
            this.state.currentIndex++; this.render(); 
        } else { 
            this.state.view = 'review'; this.render(); 
        }
    }
  }

  // --- REST OF THE METHODS (confirmFinalSave, editFromDashboard, etc.) ---
 async confirmFinalSave() {
    // --- 1. SIGNAL GUARD ---
    // Haharangin muna natin dito bago pa man mag-proceed sa opName
    if (!navigator.onLine) {
        alert("⚠️ WALANG INTERNET!\n\nHindi mai-save ang data sa database. Maghanap ng signal o kumonekta sa Wi-Fi bago i-click ang Submit.");
        return; // Stop the process
    }

    const opName = document.getElementById('opNameInput').value.trim().toUpperCase();
    if(!opName) return alert("Enter Operator Name!");

    // --- 2. PREPARE RECENT OPERATORS ---
    let recent = JSON.parse(localStorage.getItem('recentOperators') || '[]'); 
    recent = [opName, ...recent.filter(n => n !== opName)].slice(0, 5); 
    localStorage.setItem('recentOperators', JSON.stringify(recent));

    // --- 3. PREPARE DATA ---
    const updates = {}; 
    this.state.sessionReadings.forEach(r => { if(r) updates[`/readings/${this.state.date}/${r.id}`] = r; });
    updates[`/readings/${this.state.date}/metadata`] = { operator: opName, timestamp: Date.now() };

    // --- 4. ACTUAL SAVING WITH ERROR HANDLING ---
    try {
        await db.ref().update(updates); 
        
        // Success! Dito na natin lilinisin ang modal at progress
        document.getElementById('nameModal').classList.add('hidden');
        this.state.view = 'records'; 
        this.state.filterDate = this.state.date; 
        
        await this.syncWithCloud(this.state.date);
        
        // Clear progress ONLY if successfully saved to cloud
        localStorage.removeItem('p_last_index');
        
        alert("✅ LOGSHEET SUBMITTED!");
    } catch (e) {
        // Kung nag-error (halimbawa biglang naputol ang net habang nag-u-update)
        alert("❌ PAG-SAVE FAILED: Check your signal and try again.\n" + e.message);
    }
}

  }

 async start() { 
    await this.syncWithCloud(); 
    this.state.isSingleEdit = false; 

    // Kunin ang huling index na tinigilan (kung meron)
    const savedIndex = localStorage.getItem('p_last_index');
    
    if (savedIndex && savedIndex < MOCK_EQUIPMENT.length) {
        const resume = confirm("Resume from where you left off?");
        if (resume) {
            this.state.currentIndex = parseInt(savedIndex);
        } else {
            this.state.currentIndex = 0;
            localStorage.removeItem('p_last_index'); // Clear kung ayaw mag-resume
        }
    } else {
        // Kung wala pang nasimulan, hanapin ang unang empty
        let firstEmpty = 0; 
        for(let i=0; i<MOCK_EQUIPMENT.length; i++) { 
            if(!this.state.cloudReadings[MOCK_EQUIPMENT[i].id]) { 
                firstEmpty = i; 
                break; 
            } 
        } 
        this.state.currentIndex = firstEmpty;
    }

    this.state.view = 'reading'; 
    this.render(); 
}
  exitReading() { if (this.state.isEditingFromReview) { this.state.isEditingFromReview = false; this.state.view = 'review'; } else { this.state.view = this.state.isSingleEdit ? 'records' : 'home'; } this.state.isSingleEdit = false; this.render(); }
  editFromReview(i) { this.state.currentIndex = i; this.state.isEditingFromReview = true; this.state.view = 'reading'; this.render(); }
    handleRecordCardClick(id) {

    const selected = document.getElementById(
        `record-card-${id}`
    );

    if (!selected) return;

    /*
     * FIRST TAP
     * Focus / highlight only
     */
    if (!selected.classList.contains('powercon-focused')) {

        this.focusRecordCard(id);

        return;
    }

    /*
     * SECOND TAP ON SAME CARD
     * Open protected editing
     */
    this.editFromDashboard(id);
}
    focusRecordCard(id) {

    const cards = document.querySelectorAll(
        '.powercon-record-card'
    );

    // Reset all cards
    cards.forEach(card => {
        card.classList.remove('powercon-focused');
        card.classList.add('powercon-unfocused');
    });

    // Find selected card
    const selected = document.getElementById(
        `record-card-${id}`
    );

    if (!selected) return;

    // Highlight selected card
    selected.classList.remove('powercon-unfocused');
    selected.classList.add('powercon-focused');

    // Automatically bring it to the center
    selected.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
    });

    // Small haptic feedback
    if (navigator.vibrate) {
        navigator.vibrate(15);
    }
}
  editFromDashboard(id) { const pin = prompt("Admin PIN:"); if (pin === "abnpower") { const index = MOCK_EQUIPMENT.findIndex(e => e.id === id); if (index !== -1) { this.state.isSingleEdit = true; this.state.currentIndex = index; this.state.view = 'reading'; this.render(); } } }
  exportToExcel() {
    let csv = "ID,Equipment,Location,Previous,Current,Usage\n";
    MOCK_EQUIPMENT.forEach(eq => { const r = this.state.cloudReadings[eq.id] || { prev: '0', curr: '0', usage: '0' }; csv += `${eq.id},"${eq.name}",${eq.loc},${r.prev},${r.curr},${r.usage}\n`; });
    const blob = new Blob([csv], { type: 'text/csv' }); const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Log_${this.state.filterDate}.csv`; link.click();
  }
}

// UTILS & WINDOW FUNCTIONS
window.handleKey = (k) => { 
    const c = document.getElementById('c'); 
    const p = document.getElementById('p'); 
    if(!c || !p) return;

    // 1. KEYPAD LOGIC (PAG-TYPE)
    if (k === '⌫') {
        c.value = c.value.slice(0, -1);
    } else if (k === '.') {
        if (!c.value.includes('.')) c.value += '.';
    } else { 
        // Limit to 4 decimal places para hindi mag-overflow sa screen
        if (c.value.includes('.') && c.value.split('.')[1].length >= 4) return; 
        c.value += k; 
    }

    // 2. ERROR DETECTION LOGIC
    const currentVal = parseFloat(c.value) || 0;
    const prevVal = parseFloat(p.value) || 0;

    // 3. DIRECT COLOR FEEDBACK (Mismong Numero)
    if (c.value === "") {
        c.style.color = ""; // Neutral kapag walang tinatype
    } else if (currentVal < prevVal) {
        // ERROR: Mas mababa sa previous reading (RED)
        c.style.color = "#ef4444"; 
    } else if (currentVal > prevVal + 2000000) { 
        // TYPO: Sobrang laki ng jump (ORANGE) 
        // Pwede mong i-adjust ang 2M base sa max consumption niyo
        c.style.color = "#f59e0b";
    } else {
        // CORRECT: Normal increase (GREEN)
        c.style.color = "#10b981"; 
    }
};
window.enterNext = () => { 
    const c = document.getElementById('c'); 
    const p = document.getElementById('p'); 
    if(!c || (c.value === "" && !app.state.isSingleEdit)) return; 
    app.saveReading(c.value, p.value); 
};

window.toggleSettings = () => document.getElementById('settingsModal').classList.toggle('hidden');
window.updateOpacity = (v) => { document.documentElement.style.setProperty('--glass-opacity', v); localStorage.setItem('p_opacity', v); };
window.setBg = (val, mode) => { 
    const b = document.getElementById('bodyBg');
    
    // 1. Reset everything first
    b.style.backgroundImage = 'none';
    b.style.backgroundColor = 'transparent';
    
    // 2. Apply New Theme
    if (val.startsWith('#')) {
        b.style.backgroundColor = val;
    } else {
        b.style.backgroundImage = `url('${val}')`;
        b.style.backgroundSize = 'cover';
        b.style.backgroundPosition = 'center';
    }

    // 3. Update Mode (Light/Dark)
    b.classList.remove('light-mode', 'dark-mode');
    b.classList.add(mode + '-mode');

    // 4. Save to LocalStorage
    localStorage.setItem('p_theme_val', val);
    localStorage.setItem('p_theme_mode', mode);
};
window.handleImageUpload = (e) => { const r = new FileReader(); r.onload = (ev) => setBg(`url(${ev.target.result})`, 'dark'); r.readAsDataURL(e.target.files[0]); };
function loadSavedTheme() {
    const val = localStorage.getItem('p_theme_val') || 'assets/bg.webp';
    const mode = localStorage.getItem('p_theme_mode') || 'light';
    const op = localStorage.getItem('p_opacity') || '0.80';
    
    window.setBg(val, mode);
    window.updateOpacity(op);
}
window.startPress = () => { isLongPress = false; pressTimer = setTimeout(() => { isLongPress = true; const display = document.getElementById('c'); if(display) display.value = ""; if(navigator.vibrate) navigator.vibrate(50); }, 600); };
window.endPress = (k) => { clearTimeout(pressTimer); if(!isLongPress) { handleKey(k); } };
window.restoreDefaults = () => {
    if (confirm("Reset UI to default settings?")) {
        // 1. Burahin ang TAMANG keys na ginagamit sa loadSavedTheme
        localStorage.removeItem('p_theme_val');
        localStorage.removeItem('p_theme_mode');
        localStorage.removeItem('p_opacity');
        
        // 2. I-reset ang slider visual value
        const slider = document.querySelector('input[type="range"]');
        if(slider) slider.value = 0.80;
        
        // 3. I-apply ang default values manually para makita agad ang pagbabago
        // Default values: bg.webp, light mode, 0.80 opacity
        window.setBg('assets/bg.webp', 'light');
        window.updateOpacity('0.80');
        
        // 4. Isara ang modal
        toggleSettings();
        
        // 5. Feedback
        if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
        console.log("UI Restored to Defaults");
    }
};
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.log('Service Worker Failed', err));
    });
  }
