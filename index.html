<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#10b981">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta property="og:title" content="ABN PowerCon" />
  <meta property="og:description" content="Industrial Power Consumption Monitoring System" />
  <meta property="og:image" content="https://abnpowercon.vercel.app/og-image.png" />
  <meta property="og:type" content="website" />

  <title>ABN PowerCon</title>

  <link rel="apple-touch-icon" sizes="180x180" href="assets/abnlogo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/abnlogo.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/abnlogo.ico">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>

    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap');

    body {
      font-family: 'Plus+Jakarta+Sans', sans-serif;
      background-image: url('assets/bg.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      transition: all 0.4s ease;
      margin: 0;
    }

    .font-mono-numbers {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-card {
      transition: all 0.3s ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* =========================================================
       LIGHT MODE
       ========================================================= */

    .light-mode {
      color: #0f172a;
    }

    .light-mode .glass-card {
      background: rgba(255, 255, 255, var(--glass-opacity, 0.8));
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .light-mode .modal-content {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }

    .light-mode .text-white,
    .light-mode .font-white,
    .light-mode p.text-white {
      color: #0f172a !important;
    }

    .light-mode .num-btn {
      background: rgba(0,0,0,0.06);
      color: #0f172a;
      border: 1px solid rgba(0,0,0,0.03);
    }

    /* =========================================================
       DARK MODE
       ========================================================= */

    .dark-mode {
      color: #ffffff;
    }

    .dark-mode .glass-card {
      background: rgba(0, 0, 0, var(--glass-opacity, 0.5)) !important;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dark-mode .modal-content {
      background: #0f172a;
      color: #ffffff;
      border: 1px solid #1e293b;
    }

    .dark-mode .text-emerald-600 {
      color: #34d399 !important;
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.3);
    }

    .dark-mode input {
      color: white;
    }

    .dark-mode .num-btn {
      background: rgba(255,255,255,0.1);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* =========================================================
       KEYPAD
       ========================================================= */

    .num-btn {
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      border-radius: 1rem;
      transition: all 0.1s;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .num-btn:active,
    .num-btn.active-key {
      background: #10b981 !important;
      color: white !important;
      transform: scale(0.95);
    }

    /* =========================================================
       MODALS
       ========================================================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1.5rem;
    }

    .hidden {
      display: none !important;
    }

    .theme-preview {
      height: 35px;
      width: 100%;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.1);
    }

    /* =========================================================
       POWERCON MOBILE READING
       ========================================================= */

    .powercon-equipment-card {
      width: 100%;
      text-align: center;
      padding: 0.9rem 0.75rem;
      border-radius: 1.25rem;
      margin-bottom: 1rem;
      overflow: visible;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .powercon-equipment-name {
      font-size: clamp(1rem, 4.8vw, 1.35rem);
      line-height: 1.2;
      font-weight: 800;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .powercon-reading-label {
      font-size: clamp(0.62rem, 2.4vw, 0.75rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .powercon-reading-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.15rem, 5.8vw, 1.7rem);
      line-height: 1.15;
      font-weight: 800;
      white-space: nowrap;
      overflow: visible;
    }

    .powercon-current-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2.25rem, 12vw, 3.8rem);
      line-height: 1;
      font-weight: 800;
      width: 100%;
      min-width: 0;
      text-align: center;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
    }

    .powercon-current-input::-webkit-scrollbar {
      display: none;
    }

    /* =========================================================
       EDITABLE READING BOX
       ========================================================= */

    .powercon-edit-box {
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;

      transition:
        transform 0.15s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .powercon-edit-box:active {
      transform: scale(0.98);
    }

    .powercon-edit-box.powercon-edit-selected {
      border: 2px solid #10b981 !important;
      background: rgba(16,185,129,0.10) !important;

      box-shadow:
        0 0 0 3px rgba(16,185,129,0.12),
        0 10px 25px rgba(16,185,129,0.12);
    }

    .powercon-edit-box .edit-active-indicator {
      display: none;
    }

    .powercon-edit-box.powercon-edit-selected .edit-active-indicator {
      display: inline-flex;
    }

    .powercon-edit-help {
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #10b981;
    }

    /* =========================================================
       RECORDS
       ========================================================= */

    .powercon-record-card {
      width: 100%;
      min-width: 0;
      overflow: visible;
    }

    .powercon-record-equipment {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
      padding: 0.45rem 0.85rem;
      border-radius: 0.7rem;

      background: linear-gradient(
        135deg,
        #047857 0%,
        #10b981 50%,
        #059669 100%
      );

      border: 1px solid rgba(255, 255, 255, 0.25);

      color: #ffffff !important;

      font-size: clamp(0.72rem, 3.2vw, 0.9rem);
      line-height: 1.25;
      font-weight: 900;

      text-align: center;
      text-transform: uppercase;

      letter-spacing: 0.02em;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.35);

      box-shadow:
        0 4px 14px rgba(16, 185, 129, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.18);

      overflow-wrap: anywhere;
      word-break: normal;
    }

    .powercon-record-equipment + span {
      display: block !important;
      width: 100%;
      margin-top: 1px !important;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
    }

    .powercon-record-grid {
      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1.25fr)
        minmax(0, 0.95fr);

      width: 100%;
      gap: clamp(0.25rem, 1.8vw, 0.7rem);
      align-items: center;
      overflow: visible;
    }

    .powercon-record-cell {
      min-width: 0;
      text-align: center;
      padding:
        clamp(0.5rem, 2.5vw, 0.8rem)
        0.15rem;
      border-radius: 0.9rem;
      overflow: visible;
    }

    .powercon-record-label {
      display: block;
      width: 100%;
      font-size: clamp(0.55rem, 2.2vw, 0.7rem);
      line-height: 1.1;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: visible;
    }

    .powercon-record-value {
      display: block;
      width: 100%;
      margin-top: 0.35rem;
      font-family: 'JetBrains Mono', monospace;

      font-size: clamp(
        0.68rem,
        4vw,
        1.15rem
      );

      line-height: 1.1;
      font-weight: 800;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      letter-spacing: -0.055em;
      text-align: center;
    }

    .powercon-record-current {
      background: rgba(16, 185, 129, 0.10);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: #10b981;

      box-shadow:
        0 3px 12px rgba(16, 185, 129, 0.08);
    }

    .powercon-record-total-zero {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 900;
    }

    /* =========================================================
       RECORD FOCUS
       ========================================================= */

    .powercon-record-card {
      position: relative;
      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.25s ease,
        opacity 0.25s ease,
        border-color 0.25s ease;
    }

    .powercon-record-card.powercon-unfocused {
      opacity: 0.55;
    }

    .powercon-record-card.powercon-focused {
      opacity: 1 !important;

      transform: scale(1.015);

      border: 2px solid #10b981 !important;

      box-shadow:
        0 0 0 3px rgba(16, 185, 129, 0.18),
        0 12px 35px rgba(16, 185, 129, 0.22);

      z-index: 5;
    }

    .powercon-focus-indicator {
      display: none;
    }

    .powercon-record-card.powercon-focused .powercon-focus-indicator {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      position: absolute;
      top: 0.6rem;
      right: 0.6rem;

      width: 1.5rem;
      height: 1.5rem;

      border-radius: 999px;

      background: #10b981;
      color: white;

      font-size: 0.75rem;
      font-weight: 900;

      box-shadow:
        0 4px 12px rgba(16, 185, 129, 0.35);
    }

    @media (max-width: 480px) {

      .powercon-record-card.powercon-focused {
        transform: scale(1.01);
      }

    }

    /* =========================================================
       ACTION BUTTONS
       ========================================================= */

    .powercon-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 52px;
      padding: 0.85rem 0.75rem;

      font-size: clamp(0.68rem, 3vw, 0.82rem);
      line-height: 1.15;

      font-weight: 900;
      letter-spacing: 0.025em;

      text-align: center;
      white-space: nowrap;

      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.25);

      -webkit-font-smoothing: antialiased;

      transition:
        transform 0.15s ease,
        filter 0.15s ease;
    }

    .powercon-action-btn:active {
      transform: scale(0.96);
    }

    .powercon-action-btn.powercon-download-btn {
      color: #ffffff !important;
      background: #0f172a !important;
      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.65);
    }

    /* =========================================================
       VIEW LOGSHEET
       ========================================================= */

    .powercon-view-logsheet-btn {
      background: #ffffff;
      color: #0f172a !important;

      border: 1px solid rgba(15, 23, 42, 0.08);

      box-shadow:
        0 4px 14px rgba(15, 23, 42, 0.10);

      text-shadow: none;

      -webkit-font-smoothing: antialiased;
    }

    .powercon-view-logsheet-btn:hover {
      background: #f8fafc;
    }

    .powercon-view-logsheet-btn:active {
      transform: scale(0.98);
    }

    /* =========================================================
       HOME CONTROLS
       ========================================================= */

    .powercon-home-controls {
      width: 100%;
      max-width: 360px;

      margin: auto;

      display: flex;
      flex-direction: column;

      justify-content: center;
      align-items: center;
    }

    .powercon-home-controls > * {
      width: 100%;
    }

    /* =========================================================
       RESPONSIVE
       ========================================================= */

    @media (max-width: 350px) {

      .powercon-record-grid {
        grid-template-columns:
          minmax(0, 1fr)
          minmax(0, 1.25fr)
          minmax(0, 0.95fr);

        gap: 0.15rem;
      }

      .powercon-record-cell {
        padding-left: 0.05rem;
        padding-right: 0.05rem;
      }

      .powercon-record-value {
        font-size: 0.62rem;
        letter-spacing: -0.07em;
      }

      .powercon-record-label {
        font-size: 0.48rem;
      }

      .powercon-action-btn {
        min-height: 50px;
        padding-left: 0.45rem;
        padding-right: 0.45rem;
        font-size: 0.62rem;
        letter-spacing: 0.015em;
      }

    }

    @media (min-width: 351px) and (max-width: 430px) {

      .powercon-record-value {
        font-size: clamp(
          0.68rem,
          3.8vw,
          1rem
        );

        letter-spacing: -0.06em;
      }

      .powercon-action-btn {
        font-size: 0.7rem;
      }

    }

    @media (min-width: 431px) {

      .powercon-record-grid {
        gap: 0.65rem;
      }

      .powercon-record-value {
        font-size: 1.15rem;
        letter-spacing: -0.04em;
      }

      .powercon-action-btn {
        font-size: 0.78rem;
      }

    }

    @media (min-width: 640px) {

      .powercon-reading-number {
        font-size: 1.8rem;
      }

      .powercon-current-input {
        font-size: 3.5rem;
      }

      .powercon-record-value {
        font-size: 1.2rem;
        letter-spacing: -0.035em;
      }

    }
      /* =========================================================
   POWERCON SPLASH SCREEN
   ========================================================= */

#powerconSplash {
  position: fixed;
  inset: 0;
  z-index: 999999;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      rgba(16,185,129,0.12),
      transparent 45%
    ),
    #ffffff;

  opacity: 1;
  visibility: visible;

  transition:
    opacity 0.7s ease,
    visibility 0.7s ease;
}

#powerconSplash.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;

  transition:
    opacity 0.8s ease,
    visibility 0s linear 0.8s;
}

#powerconSplash.hide .splash-content {
  animation: splashExit 0.8s ease forwards;
}

#powerconSplash.hide .splash-loader-bar {
  animation: none;
}

.splash-content {
  width: 100%;
  max-width: 320px;

  display: flex;
  flex-direction: column;
  align-items: center;

  text-align: center;

  animation: splashEnter 0.8s ease-out;
}

.splash-logo {
  width: 92px;
  height: 92px;

  object-fit: contain;

  margin-bottom: 18px;

  animation:
    splashLogo 1.2s ease-in-out infinite alternate;
}

.splash-title {
  font-size: 38px;
  font-weight: 900;
  font-style: italic;
  letter-spacing: -2px;
  line-height: 1;
}

.splash-title span {
  color: #10b981;
}

.splash-subtitle {
  margin-top: 8px;

  font-size: 9px;
  font-weight: 800;

  letter-spacing: 4px;

  opacity: 0.45;
}

.splash-loader {
  width: 180px;
  height: 4px;

  margin-top: 32px;

  overflow: hidden;

  border-radius: 999px;

  background: rgba(16,185,129,0.12);
}

.splash-loader-bar {
  width: 40%;
  height: 100%;

  border-radius: inherit;

  background: #10b981;

  animation: splashLoading 1.2s ease-in-out infinite;
}

.splash-status {
  margin-top: 12px;

  font-size: 8px;
  font-weight: 800;

  letter-spacing: 2px;

  opacity: 0.4;
}

@keyframes splashLoading {

  0% {
    transform: translateX(-120%);
  }

  100% {
    transform: translateX(350%);
  }

}

@keyframes splashLogo {

  from {
    transform: scale(0.96);
    opacity: 0.75;
  }

  to {
    transform: scale(1.04);
    opacity: 1;
  }

}

@keyframes splashEnter {

  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }

  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

}
      @keyframes splashExit {

  from {
    opacity: 1;
    transform: scale(1);
  }

  to {
    opacity: 0;
    transform: scale(0.98);
  }

}

  </style>
</head>

<body id="bodyBg" class="h-full light-mode">

       POWERCON SPLASH SCREEN

  </div>


  <!-- =========================================================

  <div id="app" class="h-full w-full"></div>

  </div>


  <script>

    /* =========================================================
       FIREBASE
       ========================================================= */

    const firebaseConfig = {
      apiKey: "AIzaSyCwtWs9YdZMojl1FwQNXbAF-QRhWCrlWMQ",

    document.addEventListener('keydown', (e) => {

      if (!window.app || app.state.view !== 'reading') return;

      const key = e.key;

      if (/[0-9]/.test(key)) {

        handleKey(key);
        animateKey(key);

      }

      else if (key === '.') {

        handleKey('.');
        animateKey('.');

      }

      else if (key === 'Backspace') {

        handleKey('⌫');
        animateKey('⌫');

      }

      else if (key === 'Enter') {

        window.enterNext();

      }

    });


    function animateKey(k) {

      const btn =
        Array.from(document.querySelectorAll('.num-btn'))
          .find(b => b.innerText.trim() === k);

      if (btn) {

        btn.classList.add('active-key');

        setTimeout(() => {

      /* =======================================================
         FIREBASE SYNC
         ======================================================= */

      async syncWithCloud(targetDate = null) {

        this.state.loading = true;

        this.render();

        const dateToQuery =
          targetDate || this.state.date;

        try {

          const snapshot =
            await db
              .ref('readings/' + dateToQuery)
              .once('value');

          this.state.cloudReadings =
            snapshot.val() || {};


          const d = new Date(dateToQuery);

          d.setDate(d.getDate() - 1);

          const yKey = getLocalDate(d);

          const ySnap =
            await db
              .ref('readings/' + yKey)
              .once('value');

          this.state.yesterdayReadings =
            ySnap.val() || {};


          MOCK_EQUIPMENT.forEach((eq, i) => {

            if (this.state.cloudReadings[eq.id]) {

              this.state.sessionReadings[i] =
                this.state.cloudReadings[eq.id];

            }

          });

        }

        catch (e) {

          console.error(e);

        }

        this.state.loading = false;

        this.render();

      }

      /* =======================================================
         SAVE / UPDATE READING
         ======================================================= */

      async saveReading(currInput, prevInput) {

        const eq =
          MOCK_EQUIPMENT[this.state.currentIndex];


        /*
         * =====================================================
         * ADMIN SINGLE EDIT
         * =====================================================
         */

        if (this.state.isSingleEdit) {

          const existing =
            this.state.cloudReadings[eq.id];


          if (!existing) {

            alert(
              "❌ Cannot edit.\n\nNo existing Firebase log found."
            );

            return;

          }


          let newPrev =
            String(existing.prev ?? '0');


          let newCurr =
            String(existing.curr ?? '0');


          /*
           * Previous selected
           */
          if (this.state.editField === 'previous') {

            if (
              currInput === '' ||
              currInput === null ||
              currInput === undefined
            ) {

              alert(
                "⚠️ Please enter the new Previous Reading."
              );

              return;

            }

            newPrev = String(currInput);

          }


          /*
           * Current selected
           */
          else if (this.state.editField === 'current') {

            if (
              currInput === '' ||
              currInput === null ||
              currInput === undefined
            ) {

              alert(
                "⚠️ Please enter the new Current Reading."
              );

              return;

            }

            newCurr = String(currInput);

          }


          else {

            alert(
              "⚠️ Please select Previous or Current first."
            );

            return;

          }


          const currentNum =
            parseFloat(newCurr);


          const prevNum =
            parseFloat(newPrev);


          if (
            !Number.isFinite(currentNum) ||
            !Number.isFinite(prevNum)
          ) {

            alert(
              "⚠️ Invalid reading value."
            );

            return;

          }


          const usage =
            (currentNum - prevNum).toFixed(3);


          /*
           * Prevent accidental negative consumption.
           */

          if (
            currentNum < prevNum &&
            !confirm(
              "⚠️ Current is lower than Previous.\n\nSave this correction anyway?"
            )
          ) {

            return;

          }


          /*
           * =====================================================
           * NEW CORRECTED FIREBASE RECORD
           * =====================================================
           */

          const correctedData = {

            id: eq.id,

            name: eq.name,

            loc: eq.loc,

            curr: newCurr,

            prev: newPrev,

            usage: usage

          };


      try {

    /*
     * =====================================================
     * SAVE CORRECTED CURRENT DATE RECORD
     * =====================================================
     */

    const recordRef =
      db.ref(
        `readings/${this.state.filterDate}/${eq.id}`
      );


    /*
     * Delete old wrong log first.
     */

    await recordRef.remove();


    /*
     * Write corrected log.
     */

    await recordRef.set(
      correctedData
    );


    /*
 * =====================================================
 * REVERSE SYNC
 *
 * TWO-WAY SYNC
 *
 * 1. EDIT PREVIOUS
 *    Aug 25 Previous
 *    ↓
 *    Aug 24 Current
 *
 * 2. EDIT CURRENT
 *    Aug 24 Current
 *    ↓
 *    Aug 25 Previous
 *
 * Both sides recalculate Usage.
 * =====================================================
 */


/*
 * =====================================================
 * CASE 1:
 * ADMIN EDITED PREVIOUS
 *
 * Example:
 *
 * Aug 25 Previous = 160
 *
 * Then:
 *
 * Aug 24 Current = 160
 *
 * and Aug 24 Usage is recalculated.
 * =====================================================
 */

if (this.state.editField === 'previous') {

  /*
   * Get previous calendar date.
   */

  const previousDateObj =
    new Date(
      this.state.filterDate + 'T00:00:00'
    );

  previousDateObj.setDate(
    previousDateObj.getDate() - 1
  );

  const previousDate =
    getLocalDate(previousDateObj);


  /*
   * Get previous date's equipment record.
   */

  const previousRecordRef =
    db.ref(
      `readings/${previousDate}/${eq.id}`
    );


  const previousSnapshot =
    await previousRecordRef.once('value');


  const previousRecord =
    previousSnapshot.val();


  /*
   * Only reverse-sync if the previous date
   * actually has an existing log.
   */

  if (previousRecord) {

    /*
     * Previous date's CURRENT becomes
     * the edited PREVIOUS value.
     */

    const correctedPreviousCurrent =
      newPrev;


    const previousPrevNum =
      parseFloat(
        previousRecord.prev ?? '0'
      );


    const correctedCurrentNum =
      parseFloat(
        correctedPreviousCurrent
      );


    /*
     * Recalculate previous date usage.
     */

    const correctedPreviousUsage =
      (
        correctedCurrentNum -
        previousPrevNum
      ).toFixed(3);


    /*
     * Keep existing previous-date data.
     * Only update Current + Usage.
     */

    const reverseSyncedData = {

      ...previousRecord,

      curr:
        correctedPreviousCurrent,

      usage:
        correctedPreviousUsage

    };


    /*
     * Save corrected previous-date record.
     */

    await previousRecordRef.update({

      curr:
        correctedPreviousCurrent,

      usage:
        correctedPreviousUsage

    });


    console.log(
      "✅ REVERSE SYNC PREVIOUS → CURRENT",
      {
        equipment: eq.name,
        editedDate: this.state.filterDate,
        previousDate: previousDate,
        newPreviousDateCurrent:
          correctedPreviousCurrent,
        newPreviousDateUsage:
          correctedPreviousUsage
      }
    );

  } else {

    console.warn(
      "⚠️ Reverse sync skipped:",
      `No record found for ${previousDate}/${eq.id}`
    );

  }

}


/*
 * =====================================================
 * CASE 2:
 * ADMIN EDITED CURRENT
 *
 * Example:
 *
 * Aug 24 Current = 170
 *
 * Then:
 *
 * Aug 25 Previous = 170
 *
 * and Aug 25 Usage is recalculated.
 * =====================================================
 */

else if (this.state.editField === 'current') {

  /*
   * Get next calendar date.
   */

  const nextDateObj =
    new Date(
      this.state.filterDate + 'T00:00:00'
    );

  nextDateObj.setDate(
    nextDateObj.getDate() + 1
  );

  const nextDate =
    getLocalDate(nextDateObj);


  /*
   * Get next date's equipment record.
   */

  const nextRecordRef =
    db.ref(
      `readings/${nextDate}/${eq.id}`
    );


  const nextSnapshot =
    await nextRecordRef.once('value');


  const nextRecord =
    nextSnapshot.val();


  /*
   * Only reverse-sync if the next date
   * actually has an existing log.
   */

  if (nextRecord) {

    /*
     * Next date's PREVIOUS becomes
     * the edited CURRENT value.
     */

    const correctedNextPrevious =
      newCurr;


    const nextCurrentNum =
      parseFloat(
        nextRecord.curr ?? '0'
      );


    const correctedNextPreviousNum =
      parseFloat(
        correctedNextPrevious
      );


    /*
     * Recalculate next date usage.
     */

    const correctedNextUsage =
      (
        nextCurrentNum -
        correctedNextPreviousNum
      ).toFixed(3);


    /*
     * Keep existing next-date data.
     * Only update Previous + Usage.
     */

    await nextRecordRef.update({

      prev:
        correctedNextPrevious,

      usage:
        correctedNextUsage

    });


    console.log(
      "✅ REVERSE SYNC CURRENT → PREVIOUS",
      {
        equipment: eq.name,
        editedDate: this.state.filterDate,
        nextDate: nextDate,
        newNextDatePrevious:
          correctedNextPrevious,
        newNextDateUsage:
          correctedNextUsage
      }
    );

  } else {

    console.warn(
      "⚠️ Forward sync skipped:",
      `No record found for ${nextDate}/${eq.id}`
    );

  }

}

    /*
     * =====================================================
     * UPDATE LOCAL STATE
     * =====================================================
     */

    this.state.cloudReadings[eq.id] =
      correctedData;


    this.state.sessionReadings[
      this.state.currentIndex
    ] = correctedData;


    /*
     * =====================================================
     * RESET EDIT MODE
     * =====================================================
     */

    this.state.isSingleEdit = false;

    this.state.editField = null;

    this.state.view = 'records';


    /*
     * =====================================================
     * RELOAD FIREBASE
     *
     * This refreshes the UI with the corrected values.
     * =====================================================
     */

    await this.syncWithCloud(
      this.state.filterDate
    );


    alert(
      `✅ ${eq.name}\n\n` +
      `READING UPDATED SUCCESSFULLY!\n\n` +
      `Previous: ${newPrev}\n` +
      `Current: ${newCurr}\n` +
      `Usage: ${usage}`

    );

}

catch (e) {

    console.error(
      "EDIT SAVE ERROR:",
      e
    );


    alert(
      "❌ UPDATE FAILED!\n\n" +
      "The old record may not have been replaced.\n\n" +
      e.message
    );

}


          return;

        }


        /*
         * =====================================================
         * NORMAL READING MODE
         * =====================================================
         */

        const currentStr =
          currInput || "0";


        const prevStr =
          prevInput || "0";


        const currentNum =
          parseFloat(currentStr);


        const prevNum =
          parseFloat(prevStr);


        const usage =
          (currentNum - prevNum).toFixed(3);


        if (
          currentNum < prevNum &&
          !confirm(
            "⚠️ Current lower than previous. Save anyway?"
          )
        ) {

          return;

        }


        const data = {

          id: eq.id,

          name: eq.name,

          loc: eq.loc,

          curr: currentStr,

          prev: prevStr,

          usage: usage

        };


        this.state.sessionReadings[

        ] = data;


        localStorage.setItem(
          'p_last_index',

        );


        if (this.state.isEditingFromReview) {

        else {

          }

        }

      }

      /* =======================================================
         FINAL SAVE
         ======================================================= */

      async confirmFinalSave() {

        if (!navigator.onLine) {

          alert(
            "⚠️ WALANG INTERNET!\n\n" +
            "Hindi mai-save ang data sa database."
          );

          return;

        }


        const input =
          document.getElementById(
            'opNameInput'
          );


        const opName =
          input.value.trim().toUpperCase();


        if (!opName) {

          return alert(
            "Enter Operator Name!"
          );

        }


        let recent =
          JSON.parse(
            localStorage.getItem(
              'recentOperators'
            ) || '[]'
          );


        recent =
          [
            opName,
            ...recent.filter(
              n => n !== opName
            )
          ].slice(0, 5);


        localStorage.setItem(
          'recentOperators',
          JSON.stringify(recent)
        );


        const updates = {};


        this.state.sessionReadings.forEach(r => {

          if (r) {

            updates[
              `/readings/${this.state.date}/${r.id}`
            ] = r;

          }

        });


        updates[
          `/readings/${this.state.date}/metadata`
        ] = {

          operator: opName,

          timestamp: Date.now()

        };


        try {

          await db.ref().update(
            updates
          );


          document
            .getElementById('nameModal')
            .classList
            .add('hidden');


          this.state.view =
            'records';


          this.state.filterDate =
            this.state.date;


          await this.syncWithCloud(
            this.state.date
          );


          localStorage.removeItem(
            'p_last_index'
          );


          alert(
            "✅ LOGSHEET SUBMITTED!"
          );

        }

        catch (e) {

          alert(
            "❌ PAG-SAVE FAILED:\n\n" +
            e.message
          );

        }

      }

      /* =======================================================
         START
         ======================================================= */

      async start() {

        await this.syncWithCloud();


        this.state.isSingleEdit =
          false;


        this.state.isEditingFromReview =
          false;


        this.state.editField =
          null;


        const savedIndex =
          localStorage.getItem(
            'p_last_index'
          );


        if (
          savedIndex &&
          savedIndex < MOCK_EQUIPMENT.length
        ) {

          const resume =
            confirm(
              "Resume from where you left off?"
            );


          if (resume) {

            this.state.currentIndex =
              parseInt(savedIndex);

          }

          else {

            this.state.currentIndex = 0;

            localStorage.removeItem(
              'p_last_index'
            );

          }

        }

        else {

          let firstEmpty = 0;


          for (
            let i = 0;
            i < MOCK_EQUIPMENT.length;
            i++
          ) {

            if (
              !this.state.cloudReadings[
                MOCK_EQUIPMENT[i].id
              ]
            ) {

              firstEmpty = i;

              break;

            }

          }


          this.state.currentIndex =
            firstEmpty;

        }


        this.state.view =
          'reading';


        this.render();

      }

        this.state.editField =

      }

         ======================================================= */

      handleRecordCardClick(id) {

        const selected =
          document.getElementById(
            `record-card-${id}`
          );


        if (!selected) return;


        if (
          !selected.classList.contains(
            'powercon-focused'
          )
        ) {

          this.focusRecordCard(id);

          return;

        }


        this.editFromDashboard(id);

      }


      /* =======================================================
         FOCUS RECORD
         ======================================================= */

      focusRecordCard(id) {

        const cards =
          document.querySelectorAll(
            '.powercon-record-card'
          );


        cards.forEach(card => {

          card.classList.remove(
            'powercon-focused'
          );

          card.classList.add(
            'powercon-unfocused'
          );

        });


        const selected =
          document.getElementById(
            `record-card-${id}`
          );


        if (!selected) return;


        selected.classList.remove(
          'powercon-unfocused'
        );


        selected.classList.add(
          'powercon-focused'
        );


        selected.scrollIntoView({

          behavior: 'smooth',

          block: 'center'

        });


        if (navigator.vibrate) {

          navigator.vibrate(15);

        }

      }


      /* =======================================================
         ADMIN DASHBOARD EDIT
         ======================================================= */

      editFromDashboard(id) {

        const pin =
          prompt(
            "Admin PIN:"
          );


        if (pin !== "abnpower") {

          if (pin !== null) {

            alert(
              "❌ INVALID ADMIN PIN"
            );

          }

          return;

        }


        const index =
          MOCK_EQUIPMENT.findIndex(
            e => e.id === id
          );


        if (index === -1) return;


        const record =
          this.state.cloudReadings[id];


        if (!record) {

          alert(
            "❌ No existing log found for this equipment."
          );

          return;

        }


        /*
         * ADMIN EDIT STARTS
         */

        this.state.isSingleEdit =
          true;


        this.state.isEditingFromReview =
          false;


        this.state.currentIndex =
          index;


        /*
         * DEFAULT = CURRENT
         *
         * So existing current value immediately
         * appears in the keypad.
         */

        this.state.editField =
          'current';


        this.state.view =
          'reading';


        this.render();


        setTimeout(() => {

          const input =
            document.getElementById(
              'c'
            );


          if (input) {

            input.focus();

          }

        }, 50);

      }


      /* =======================================================
         EXPORT CSV
         ======================================================= */

      exportToExcel() {

        let csv =
          "ID,Equipment,Location,Previous,Current,Usage\n";


        MOCK_EQUIPMENT.forEach(eq => {

          const r =
            this.state.cloudReadings[eq.id] ||
            {
              prev: '0',
              curr: '0',
              usage: '0'
            };


          csv +=
            `${eq.id},"${eq.name}",${eq.loc},` +
            `${r.prev},${r.curr},${r.usage}\n`;

        });


        const blob =
          new Blob(
            [csv],
            {
              type: 'text/csv'
            }
          );


        const link =
          document.createElement(
            "a"
          );


        link.href =
          URL.createObjectURL(
            blob
          );


        link.download =
          `Log_${this.state.filterDate}.csv`;


        link.click();


        URL.revokeObjectURL(
          link.href
        );

      }

    }


    /* =========================================================
       KEYPAD LOGIC
       ========================================================= */

    window.handleKey = (k) => {

      const c =
        document.getElementById(
          'c'
        );


      const p =
        document.getElementById(
          'p'
        );


      if (!c || !p) return;


      /*
       * BACKSPACE
       */

      if (k === '⌫') {

        c.value =
          c.value.slice(
            0,
            -1
          );

      }


      /*
       * DECIMAL
       */

      else if (k === '.') {

        if (
          !c.value.includes('.')
        ) {

          c.value += '.';

        }

      }


      /*
       * NUMBER
       */

      else {

        /*
         * Max 4 decimal places.
         */

        if (
          c.value.includes('.') &&
          c.value.split('.')[1].length >= 4
        ) {

          return;

        }


        c.value += k;

      }


      /*
       * =====================================================
       * COLOR FEEDBACK
       *
       * IMPORTANT:
       *
       * Normal mode:
       * compare Current against Previous.
       *
       * Admin Previous edit:
       * compare new Previous against existing Current.
       *
       * Admin Current edit:
       * compare Current against Previous.
       * =====================================================
       */

      const currentVal =
        parseFloat(c.value) || 0;


      const prevVal =
        parseFloat(p.value) || 0;


      const editingPrevious =
        app.state.isSingleEdit &&
        app.state.editField === 'previous';


      if (c.value === '') {

        c.style.color = "";

      }

      else if (editingPrevious) {

        /*
         * Previous should normally be <= Current.
         */

        const existingCurrent =
          parseFloat(
            app.state.cloudReadings[
              MOCK_EQUIPMENT[
                app.state.currentIndex
              ].id
            ]?.curr
          ) || 0;


        if (currentVal > existingCurrent) {

          c.style.color =
            "#ef4444";

        }

        else {

          c.style.color =
            "#10b981";

        }

      }

      else if (currentVal < prevVal) {

        c.style.color =
          "#ef4444";

      }

      else if (
        currentVal >
        prevVal + 2000000
      ) {

        c.style.color =
          "#f59e0b";

      }

      else {

        c.style.color =
          "#10b981";

      }

    };


    /* =========================================================
       ENTER / SAVE
       ========================================================= */

    window.enterNext = () => {

      const c =
        document.getElementById(
          'c'
        );


      const p =
        document.getElementById(
          'p'
        );


      if (!c || !p) return;


      /*
       * Normal reading cannot be blank.
       *
       * Admin edit also cannot be blank.
       */

      if (
        c.value === ''
      ) {

        alert(
          "⚠️ Please enter a reading."
        );

        return;

      }


      app.saveReading(
        c.value,
        p.value
      );

    };


    /* =========================================================
       SETTINGS
       ========================================================= */

    window.toggleSettings = () => {

      document
        .getElementById(
          'settingsModal'
        )
        .classList
        .toggle('hidden');

    };


    window.updateOpacity = (v) => {

      document.documentElement
        .style
        .setProperty(
          '--glass-opacity',
          v
        );


      localStorage.setItem(
        'p_opacity',
        v
      );

    };


    window.setBg = (val, mode) => {

      const b =
        document.getElementById(
          'bodyBg'
        );


      b.style.backgroundImage =
        'none';


      b.style.backgroundColor =
        'transparent';


      if (val.startsWith('#')) {

        b.style.backgroundColor =
          val;

      }

      else {

        b.style.backgroundImage =
          `url('${val}')`;

        b.style.backgroundSize =
          'cover';

        b.style.backgroundPosition =
          'center';

      }


      b.classList.remove(
        'light-mode',
        'dark-mode'
      );


      b.classList.add(
        mode + '-mode'
      );


      localStorage.setItem(
        'p_theme_val',
        val
      );


      localStorage.setItem(
        'p_theme_mode',
        mode
      );

    };


    window.handleImageUpload = (e) => {

      const r =
        new FileReader();


      r.onload = (ev) => {

        setBg(
          `url(${ev.target.result})`,
          'dark'
        );

      };


      r.readAsDataURL(
        e.target.files[0]
      );

    };


    function loadSavedTheme() {

      const val =
        localStorage.getItem(
          'p_theme_val'
        ) ||
        'assets/bg.webp';


      const mode =
        localStorage.getItem(
          'p_theme_mode'
        ) ||
        'light';


      const op =
        localStorage.getItem(
          'p_opacity'
        ) ||
        '0.80';


      window.setBg(
        val,
        mode
      );


      window.updateOpacity(
        op
      );

    }


    /* =========================================================
       ZERO LONG PRESS
       ========================================================= */

    window.startPress = () => {

      isLongPress = false;


      pressTimer =
        setTimeout(() => {

          isLongPress = true;


          const display =
            document.getElementById(
              'c'
            );


          if (display) {

            display.value =
              "";

          }


          if (navigator.vibrate) {

            navigator.vibrate(
              50
            );

          }

        }, 600);

    };


    window.endPress = (k) => {

      clearTimeout(
        pressTimer
      );


      if (!isLongPress) {

        handleKey(k);

      }

    };


    /* =========================================================
       RESTORE DEFAULTS
       ========================================================= */

    window.restoreDefaults = () => {

      if (
        confirm(
          "Reset UI to default settings?"
        )
      ) {

        localStorage.removeItem(
          'p_theme_val'
        );


        localStorage.removeItem(
          'p_theme_mode'
        );


        localStorage.removeItem(
          'p_opacity'
        );


        const slider =
          document.querySelector(
            'input[type="range"]'
          );


        if (slider) {

          slider.value =
            0.80;

        }


        window.setBg(
          'assets/bg.webp',
          'light'
        );


        window.updateOpacity(
          '0.80'
        );


        toggleSettings();


        if (navigator.vibrate) {

          navigator.vibrate(
            [50,50,50]
          );

        }

      }

    };


    /* =========================================================
       SERVICE WORKER
       ========================================================= */

    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        () => {

          navigator.serviceWorker
            .register('sw.js')
            .then(
              reg =>
                console.log(
                  'Service Worker Registered'
                )
            )
            .catch(
              err =>
                console.log(
                  'Service Worker Failed',
                  err
                )
            );

        }
      );

    }


    /* =========================================================
       LIVE SIGNAL MONITOR
       ========================================================= */

    setInterval(() => {

      const status =
        document.getElementById(
          'signalStatus'
        );


      if (!status) return;


      if (navigator.onLine) {

        status.innerText =
          "● ONLINE: READY TO SUBMIT";


        status.style.color =
          "#10b981";


        status.style.opacity =
          "1";

      }

      else {

        status.innerText =
          "● OFFLINE: FIND BETTER SIGNAL";


        status.style.color =
          "#ef4444";


        status.style.opacity =
          "1";

      }

    }, 2000);


/* =========================================================
   START APPLICATION
   ========================================================= */

const app =
  new PowerCon();


/* =========================================================
   HIDE SPLASH SCREEN
   ========================================================= */

window.addEventListener('load', () => {

  setTimeout(() => {

    const splash =
      document.getElementById(
        'powerconSplash'
      );

    if (splash) {

      splash.classList.add('hide');

      setTimeout(() => {

        splash.remove();

      }, 800);

    }

  }, 2500);

});

  </script>

</body>
